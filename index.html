<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3250">
<meta name="description" content="مهمة حقيقية من عميل · ٨ أسئلة · ٧ دقائق — اكتشف وين أنت جاهز ووين لا">
<title>تحدي أول يوم دوام · مبرمج</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B3250'/%3E%3Crect x='9' y='18' width='5' height='5' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B3250;--navy-700:#132540;--ink:#0F1B2D;--paper:#F6F4EF;--card:#FFFFFF;--line:#E3DFD6;
  --muted:#5F6673;--accent:#E8A33D;--ok:#2F8F6B;--gap:#D99A2B;--blind:#C8473A;--chat:#DCF8C6;
  --ok-bg:#E6F3ED;--gap-bg:#FBF1DC;--blind-bg:#F8E4E1;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#app{padding-bottom:24px}
code,.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
code{background:#ECE8DD;padding:1px 6px;border-radius:5px;font-size:.88em}
h1,h2,h3{color:var(--navy);line-height:1.4;margin:0}
h1{font-size:28px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ticket */
.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand img{height:26px;width:auto;display:block}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--paper);border:1px solid var(--line);margin-top:-6px}
.ticket:before{right:-7px}.ticket:after{left:-7px}
.ticket .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ticket .no{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--navy);direction:ltr}
.ticket .sub{font-size:16px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:16px;font-weight:500;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;line-height:1.7}
.pill.new{background:#EDEAE0}
.pill.doing{background:var(--gap-bg);border-color:#EBD3A0;color:#7A5410}
.pill.done{background:var(--ok-bg);border-color:#BFE0D0;color:#1D6247}
.ticket.compact{padding:6px 12px}
.ticket.compact .sub{display:none}

/* buttons */
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:18px;padding:10px 18px;text-align:center;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--navy-700)}
.btn:disabled{background:#B9C0CB;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sec:hover{background:#EEF1F5}
.btn.ghost{background:transparent;color:var(--navy);border:0;text-decoration:underline;font-weight:500;min-height:44px}
.btn.sm{min-height:44px;font-size:16px;width:auto;display:inline-block;padding:6px 14px}
.stack>*+*{margin-top:12px}
.actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 78%,rgba(246,244,239,0));padding:14px 0 14px;margin-top:16px;z-index:5}
.actions.static{position:static;background:none}
.small{font-size:16px;color:var(--muted);text-align:center;margin-top:8px}

/* landing */
.hero{padding:22px 0 8px}
.hero h1{margin:6px 0 10px}
.lines{list-style:none;padding:0;margin:18px 0}
.lines li{padding:8px 14px 8px 0;border-inline-start:3px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;margin-bottom:8px;padding-inline-start:12px;border-radius:8px}
.resume{background:#fff;border:1.5px solid var(--navy);border-radius:12px;padding:14px;margin:14px 0}
.resume .two{display:flex;gap:10px;margin-top:10px}
.resume .two .btn{min-height:46px;font-size:16px}
.vid{margin:14px 0;border-radius:12px;overflow:hidden;background:var(--navy);aspect-ratio:16/9;position:relative}
.vid iframe,.vid video{width:100%;height:100%;border:0;display:block}
.vid{aspect-ratio:auto;min-height:64px}
.vid button{width:100%;min-height:64px;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:12px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
.vid .play{width:0;height:0;border-inline-start:14px solid var(--navy);border-top:9px solid transparent;border-bottom:9px solid transparent;transform:scaleX(-1)}
.vid{background:none}
.vid.tall{aspect-ratio:auto;height:560px;background:#fff;border:1px solid var(--line)}

/* chat */
.chat{background:#E9E3D6;border-radius:14px;padding:12px}
.bubble{background:var(--chat);border-radius:12px 12px 12px 4px;padding:8px 12px 6px;max-width:94%;box-shadow:0 1px 0 rgba(0,0,0,.08);margin-bottom:8px}
.bubble .who{font-size:16px;font-weight:700;color:#1F6F4F}
.bubble p{margin:2px 0}
.bubble .t{font-size:16px;color:#5a6b57;text-align:end;direction:ltr;font-family:var(--mono);margin-top:2px}
.brief-sum{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px}
.brief-sum div{display:flex;gap:10px;padding:10px 14px}
.brief-sum div+div{border-top:1px solid var(--line)}
.brief-sum b{color:var(--navy);min-width:64px}

/* pipeline */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 4px}
.pipe{display:flex;align-items:center;flex:1}
.pipe .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;font:500 16px/24px var(--mono);text-align:center;color:var(--muted);flex:none}
.pipe .n.done{background:var(--navy);border-color:var(--navy);color:#fff}
.pipe .n.cur{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(232,163,61,.55)}
.pipe .ln{flex:1;height:2px;background:var(--line)}
.pipe .ln.done{background:var(--navy)}
.count{font:500 18px "IBM Plex Sans Arabic",sans-serif;color:var(--navy);white-space:nowrap}
.stagebar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.stage{font-size:16px;font-weight:500;color:var(--muted)}
.briefbtn{background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 14px;font-size:16px;min-height:44px}

/* question */
.q{font-size:19px;font-weight:500;line-height:1.75;margin:6px 0 4px}
.q p{margin-bottom:8px}
.q ol{margin:0 0 10px;padding-inline-start:28px;list-style-type:arabic-indic}
.hint{font-size:16px;color:var(--muted);margin:6px 0 12px}
.editor{direction:ltr;background:var(--navy);color:#E8EDF4;border-radius:12px;padding:12px 0;margin:10px 0 14px;font:400 14px/1.7 var(--mono);overflow:hidden}
.editor .ln{display:flex;white-space:pre-wrap;word-break:break-word;padding-right:12px}
.editor .ln i{font-style:normal;flex:none;width:36px;text-align:right;padding-right:12px;color:#7389A6;user-select:none}
.editor .ln.mk{background:rgba(232,163,61,.18);box-shadow:inset 3px 0 0 var(--accent)}
.editor .kw{color:#8FB7F0}.editor .st{color:#A9D9B0}
.cursor{display:inline-block;width:8px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.opt:hover{border-color:#B9B3A3}
.opt[aria-checked=true]{border-color:var(--navy);background:#EEF2F7}
.opt .mk{flex:none;width:24px;height:24px;border:2px solid #9AA3B0;margin-top:3px;background:#fff;display:grid;place-items:center;color:#fff;font-size:15px;line-height:1}
.opt[role=radio] .mk{border-radius:50%}
.opt[role=checkbox] .mk{border-radius:5px}
.opt[aria-checked=true] .mk{background:var(--navy);border-color:var(--navy)}
.opt[role=radio][aria-checked=true] .mk:after{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.opt[role=checkbox][aria-checked=true] .mk:after{content:"✓"}
.opt .body{flex:1;min-width:0}
.opt.codeopt .body{font-family:var(--mono);direction:ltr;text-align:left;font-size:17px}
.opt.locked{cursor:default}
.opt .tag{display:none;font-size:16px;font-weight:700;margin-top:2px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:8px;line-height:1.55;padding:2px 0}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font:500 14px/22px var(--mono);text-align:center;margin-top:2px}
.steps .note{display:block;font-size:16px;color:var(--muted);margin-top:4px;padding-inline-start:30px}
.rv .ok{border-color:var(--ok);background:var(--ok-bg)}
.rv .miss{border-color:var(--gap);background:var(--gap-bg);border-style:dashed}
.rv .bad{border-color:var(--blind);background:var(--blind-bg)}
.rv .opt .tag{display:block}
.rv .ok .tag{color:#1D6247}.rv .miss .tag{color:#7A5410}.rv .bad .tag{color:#9C2F25}
.rv .neutral{opacity:.72}
.rv .opt .mk{border-color:#9AA3B0}
.conf{background:var(--card);border:1.5px solid var(--navy);border-radius:12px;padding:14px;margin-top:14px}
.conf .two{display:flex;gap:10px;margin-top:10px}
.conf .two .btn{min-height:52px}
.banner{border-radius:12px;padding:10px 14px;margin:14px 0 4px;font-weight:700}
.banner.ok{background:var(--ok-bg);color:#1D6247}
.banner.bad{background:var(--blind-bg);color:#9C2F25}
.explain{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.explain h3{margin-bottom:6px}
.explain ul{margin:0 0 6px;padding-inline-start:20px}
.explain li{margin-bottom:6px}
.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.more b{color:var(--navy)}
.reply{margin-top:14px}
.reply .lead{font-size:16px;color:var(--muted);margin-bottom:6px}

/* term tooltip */
.term{border-bottom:1.5px dotted var(--navy);cursor:help;font-family:var(--mono);font-size:.92em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.tip{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 24px));background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

/* result / gap map */
.score{font:700 54px/1.2 "IBM Plex Sans Arabic",sans-serif;color:var(--navy);display:inline-block}
.gapmap{list-style:none;margin:16px 0;padding:0;position:relative}
.gapmap li{display:flex;align-items:center;gap:12px;padding:8px 0;position:relative}
.gapmap li:not(:last-child):after{content:"";position:absolute;right:13px;top:36px;bottom:-8px;width:2px;background:var(--line)}
.gapmap .dot{flex:none;width:28px;height:28px;border-radius:50%;z-index:1;border:3px solid #fff;box-shadow:0 0 0 2px currentColor}
.gapmap .strong{color:var(--ok)}.gapmap .gap{color:var(--gap)}.gapmap .blind{color:var(--blind)}
.gapmap .dot{background:currentColor}
.gapmap .nm{flex:1;font-weight:500}
.gapmap .st{font-size:16px;font-weight:700}
.callout{border-radius:12px;padding:12px 14px;margin:12px 0}
.callout.blind{background:var(--blind-bg);border-inline-start:4px solid var(--blind)}
.callout.gap{background:var(--gap-bg);border-inline-start:4px solid var(--gap)}
.callout.strong{background:var(--ok-bg);border-inline-start:4px solid var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}

/* form */
label.f{display:block;font-weight:500;margin:14px 0 4px}
input[type=text],input[type=tel],input[type=email],select{width:100%;min-height:52px;border:1.5px solid #C9C3B3;border-radius:10px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink)}
.phone{display:flex;gap:8px;direction:ltr}
.phone select{width:118px;flex:none}
.phone input{direction:ltr;text-align:left}
.chk{display:flex;gap:10px;align-items:flex-start;margin:16px 0 6px}
.chk input{width:24px;height:24px;margin-top:4px;flex:none;accent-color:var(--navy)}
.err{color:#9C2F25;font-size:16px;margin-top:4px}

/* report */
.rep h2{margin-top:22px}
.rep .stg{margin:12px 0}
.rep .stg h3{display:flex;align-items:center;gap:8px}
.badge{display:inline-block;font-size:16px;font-weight:700;border-radius:99px;padding:0 10px}
.badge.blind{background:var(--blind-bg);color:#9C2F25}.badge.gap{background:var(--gap-bg);color:#7A5410}.badge.strong{background:var(--ok-bg);color:#1D6247}
.story{background:var(--navy);color:#EAF0F7;border-radius:12px;padding:14px}
.story b{color:var(--accent)}
.story code{background:rgba(255,255,255,.12);color:#fff}
.story .term{border-color:#fff}
.plan{list-style:none;padding:0;margin:0}
.plan li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan li b{flex:none;width:68px;color:var(--navy)}
.foot{font-size:16px;color:var(--muted);text-align:center;margin:26px 0 8px}


/* hero + badge */
.btn.amber{background:var(--accent);color:var(--ink)}.btn.amber:hover{background:#D8932C}
.hero2{background:var(--navy);color:#fff;border-radius:16px;padding:22px 18px 20px;margin:16px 0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px}
.hero2 .kick{display:inline-block;font:500 16px var(--mono);font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--accent);border:1px solid rgba(232,163,61,.55);border-radius:99px;padding:0 12px;margin-bottom:12px}
.hero2 h1{color:#fff;font-size:30px;line-height:1.45}
.hero2 .hl{color:var(--accent)}
.hero2 p{margin:12px 0 0;color:#C9D4E3;font-size:17px}
.lines li{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-inline-start:3px solid var(--accent)}
.lines .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font:500 15px/28px var(--mono);text-align:center}
.idwrap{display:flex;flex-direction:column;align-items:center;margin:16px 0 14px}
.strap{width:26px;height:34px;background:var(--accent);border-radius:4px 4px 0 0;position:relative}
.strap:after{content:"";position:absolute;left:50%;bottom:6px;margin-left:-9px;width:18px;height:6px;border-radius:3px;background:var(--navy-700)}
.idcard{width:100%;max-width:300px;background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px 14px;text-align:center;border-top:8px solid var(--accent);box-shadow:0 10px 26px rgba(19,37,64,.28)}
.idtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.idtop img{display:block;height:22px;width:auto}
.idtop .mono{font-size:14px;color:#9DB4D3;letter-spacing:.12em}
.avatar{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:var(--paper);color:var(--navy);font:700 40px/84px "IBM Plex Sans Arabic",sans-serif;border:4px solid var(--accent)}
.idname{font-size:23px;font-weight:700;line-height:1.4;word-break:break-word}
.idrole{color:var(--accent);font-size:16px;margin-bottom:12px}
.idinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;text-align:start;margin:0 0 12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.25)}
.idinfo dt{font-size:14px;color:#9DB4D3;line-height:1.4}
.idinfo dd{margin:0;font-size:16px;font-weight:500}
.barcode{height:34px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 6px,transparent 6px 9px,#fff 9px 12px,transparent 12px 14px)}
#b-name{margin-top:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:25px}.q{font-size:18px}}

@media print{
  body{background:#fff}
  .noprint,.brand,.ticket,.actions,.tip,.foot a{display:none!important}
  .rep h2,.rep h3{color:var(--navy)}
  .card,.story,.callout{break-inside:avoid}
  .story{background:#fff;color:#000;border:1px solid var(--navy)}
  .story b{color:var(--navy)}
  .story code{background:#eee;color:#000}
  .wrap{max-width:none}
}
</style>
</head>

const VISITOR_KEY = "mbrmj_visitor", QUEUE_KEY = "mbrmj_queue", LEAD_KEY = "mbrmj_pending_lead";
const MAX_AGE = 7 * 24 * 3600 * 1000;

const $ = (s) => document.querySelector(s);
const toAr = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};
const stageName = (k) => STAGES.find((s) => s.k === k).ar;

/* inline markup: **bold**, `code`, {{glossary term}} */
function fmt(s) {
  let h = esc(s);
  h = h.replace(/\{\{(.+?)\}\}/g, (m, k) => GLOSSARY[k] ? '<span class="term" role="button" tabindex="0" data-term="' + k + '">' + k + "</span>" : k);
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return h.replace(/`(.+?)`/g, "<code>$1</code>");
}

/* ---------- state ---------- */
const params = new URLSearchParams(location.search);
let variant = (params.get("v") || "").toLowerCase();
if (!TITLES[variant]) variant = "a";
let visitorId = store.get(VISITOR_KEY);
const returning = !!visitorId;
if (!visitorId) { visitorId = uuid(); store.set(VISITOR_KEY, visitorId); }

function newState() {
  return { sid: uuid(), vid: visitorId, variant, screen: "landing", q: 0, phase: "answer", sel: [], tmpTime: 0, answers: {}, order: {}, startedAt: null, qStart: null, updated: Date.now(), done: false, lead: null };
}
let S = null, resumeMode = false, sheetOpen = false, moreOpen = false;

function save() { if (!S) return; S.updated = Date.now(); store.set(CONFIG.STORAGE_KEY, JSON.stringify(S)); }
function loadSaved() {
  try {
    const s = JSON.parse(store.get(CONFIG.STORAGE_KEY) || "null");
    if (s && s.sid && Date.now() - s.updated < MAX_AGE) return s;
  } catch (e) { /* ignore */ }
  return null;
}

/* ---------- tracking ---------- */
let queue = [];
try { queue = JSON.parse(store.get(QUEUE_KEY) || "[]"); } catch (e) { queue = []; }
const persistQ = () => store.set(QUEUE_KEY, JSON.stringify(queue.slice(-300)));
const curStep = () => S.screen === "q" ? "q" + (S.q + 1) : S.screen;
function log(event, data, step) {
  queue.push({ ts: new Date().toISOString(), session_id: S.sid, visitor_id: S.vid, variant: S.variant, event, step: step || curStep(), data: data || {} });
  persistQ();
}
function flush(beacon) {
  if (!CONFIG.APPS_SCRIPT_URL || !queue.length) return;
  const batch = queue.splice(0, queue.length);
  persistQ();
  const body = JSON.stringify({ type: "events", events: batch });
  const requeue = () => { queue = batch.concat(queue); persistQ(); };
  try {
    if (beacon && navigator.sendBeacon) {
      if (!navigator.sendBeacon(CONFIG.APPS_SCRIPT_URL, new Blob([body], { type: "text/plain" }))) requeue();
    } else {
      fetch(CONFIG.APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body, keepalive: body.length < 60000 }).catch(requeue);
    }
  } catch (e) { requeue(); }
}
function sendLead(payload) {
  if (!CONFIG.APPS_SCRIPT_URL) { store.set(LEAD_KEY, JSON.stringify(payload)); return; }
  store.set(LEAD_KEY, JSON.stringify(payload));
  try {
    fetch(CONFIG.APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) })
      .then(() => store.del(LEAD_KEY)).catch(() => { /* retried on next load */ });
  } catch (e) { /* retried on next load */ }
}
let hiddenLogged = false;
function onHide() {
  if (!S) return;
  if (!S.done && !hiddenLogged) { log("abandon", { last_step: curStep() }); hiddenLogged = true; }
  flush(true);
}
addEventListener("pagehide", onHide);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") onHide(); else hiddenLogged = false; });

/* ---------- scoring ---------- */
function computeStages() {
  const res = {};
  STAGES.forEach((st) => {
    const qs = QUESTIONS.filter((q) => q.stage === st.k);
    let wrong = 0, blind = 0;
    qs.forEach((q) => { const a = S.answers[q.id - 1]; if (a && !a.correct) { wrong++; if (a.conf === "sure") blind++; } });
    res[st.k] = blind ? "blind" : wrong ? "gap" : "strong";
  });
  return res;
}
const computeScore = () => Object.values(S.answers).filter((a) => a.correct).length;
const RANK = { blind: 0, gap: 1, strong: 2 };
function ranked() {
  const st = computeStages();
  return STAGES.map((s, i) => ({ k: s.k, ar: s.ar, st: st[s.k], i })).sort((a, b) => RANK[a.st] - RANK[b.st] || a.i - b.i);
}

/* ---------- navigation ---------- */
function go(screen, q) {
  S.screen = screen;
  if (q != null) { S.q = q; S.phase = "answer"; S.sel = []; S.qStart = Date.now(); moreOpen = false; }
  if (screen === "badge") log("badge_view");
  if (screen === "brief") log("brief_view");
  if (screen === "q") log("question_view", { q: S.q + 1 });
  save(); render(true);
}
function complete() {
  S.done = true;
  S.screen = "result";
  log("complete", { score: computeScore(), stages: computeStages() });
  save(); flush(false); render(true);
}

/* ---------- rendering ---------- */
const app = () => $("#app");
let scrollTarget = null;

function statusPill() {
  const m = (S.screen === "landing" || S.screen === "badge") ? ["جديد", "new"] : (S.screen === "brief" || S.screen === "q") ? ["قيد العمل", "doing"] : ["مكتمل", "done"];
  return '<span class="pill ' + m[1] + '">' + m[0] + "</span>";
}
function header(compact) {
  return '<div class="brand"><img src="' + LOGO + '" alt="مبرمج" width="60" height="26"></div>' +
    '<div class="ticket' + (compact ? " compact" : "") + '"><div class="row"><span class="no">TASK #001</span>' + statusPill() + "</div>" +
    '<div class="sub">نظام حجز ملاعب بادل · العميل: سالم</div></div>';
}

function render(scrollTop) {
  let h = "";
  if (resumeMode) { app().innerHTML = '<div class="wrap">' + landing() + "</div>"; if (scrollTop) window.scrollTo(0, 0); return; }
  switch (S.screen) {
    case "landing": h = landing(); break;
    case "badge": h = badgeScreen(); break;
    case "brief": h = briefScreen(); break;
    case "q": h = qScreen(); break;
    case "result": h = resultScreen(); break;
    case "contact": h = contactScreen(); break;
    case "report": h = reportScreen(); break;
  }
  app().innerHTML = '<div class="wrap">' + h + "</div>" + (sheetOpen ? sheet() : "");
  if (scrollTop) window.scrollTo(0, 0);
  if (scrollTarget) { const el = $(scrollTarget); scrollTarget = null; if (el) el.scrollIntoView({ block: "start" }); }
  if (S.screen === "contact") { const n = $("#f-name"); if (n && scrollTop) { /* no autofocus on mobile */ } }
}

function landing() {
  let h = header(false) + '<section class="hero2"><div class="kick">' + esc(TITLES[S.variant]) + "</div>" +
    '<h1>تفكر إنك جاهز لأول وظيفة لك كمبرمج؟<br><span class="hl">خلنا نشوف<span class="cursor" aria-hidden="true"></span></span></h1>' +
    "<p>" + esc(SUBTITLE) + "</p></section>";

let tipEl = null;
function closeTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }
function openTip(el) {
  const term = el.dataset.term, same = tipEl && tipEl.dataset.term === term;
  closeTip(); if (same) return;
  log("tooltip_open", { term });
  tipEl = document.createElement("div");
  tipEl.className = "tip"; tipEl.setAttribute("role", "tooltip"); tipEl.dataset.term = term;
  tipEl.textContent = GLOSSARY[term];
  document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, vw = document.documentElement.clientWidth;
  let left = r.left + r.width / 2 - w / 2; left = Math.max(12, Math.min(left, vw - w - 12));
  let top = r.bottom + 8; if (top + tipEl.offsetHeight > innerHeight - 8) top = r.top - tipEl.offsetHeight - 8;
  tipEl.style.left = left + "px"; tipEl.style.top = Math.max(8, top) + "px";
}

  const logo = await loadImg(LOGO_W); if (logo) x.drawImage(logo, 540 - 150, 130, 300, 300 * logo.height / logo.width);
  x.textAlign = "left"; x.direction = "ltr";
  x.font = "500 44px " + MONO; const w1 = x.measureText("TASK #001  ·  ").width;
  x.font = "700 48px " + AR; const w2 = x.measureText("مكتمل").width, x0 = 540 - (w1 + w2) / 2;
  x.fillStyle = "#E8A33D"; x.font = "500 44px " + MONO; x.fillText("TASK #001  ·  ", x0, 500);
  x.fillStyle = "#fff"; x.font = "700 48px " + AR; x.fillText("مكتمل", x0 + w1, 500);
  x.textAlign = "center";
  x.direction = "rtl"; x.fillStyle = "#B9C6D8"; x.font = "400 52px " + AR; x.fillText("النتيجة", 540, 680);
  x.fillStyle = "#fff"; x.font = "700 220px " + AR; x.fillText(toAr(computeScore()) + "/٨", 540, 900);
  const col = { strong: "#2F8F6B", gap: "#D99A2B", blind: "#C8473A" }, st = computeStages();
  STAGES.forEach((s, i) => {
    const y = 1090 + i * 110;
    x.beginPath(); x.arc(860, y - 14, 26, 0, 7); x.fillStyle = col[st[s.k]]; x.fill();
    x.textAlign = "right"; x.fillStyle = "#fff"; x.font = "500 50px " + AR; x.fillText(s.ar, 810, y);
    x.textAlign = "left"; x.fillStyle = col[st[s.k]] === "#D99A2B" ? "#F0C26A" : col[st[s.k]] === "#C8473A" ? "#F08A7E" : "#6FCBA4"; x.font = "700 44px " + AR; x.fillText(STATUS_LABEL[st[s.k]], 220, y);
  });
  x.textAlign = "center"; x.direction = "ltr"; x.fillStyle = "#B9C6D8"; x.font = "400 46px " + AR;
  x.direction = "rtl"; x.fillText("جرب التحدي:", 540, 1700);
  x.direction = "ltr"; x.fillStyle = "#E8A33D"; x.font = "500 52px " + MONO; x.fillText(CONFIG.SITE_URL.replace(/^https?:\/\//, ""), 540, 1775);
  return new Promise((res) => { try { c.toBlob((b) => res(b), "image/png"); } catch (e) { res(null); } });
}
async function shareResult() {
  const blob = await makeCard();
  if (!blob) { alert("تعذر إنشاء بطاقة المشاركة"); return; }
  const file = new File([blob], "mbrmj-challenge.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text: "جربت تحدي مبرمج — " + CONFIG.SITE_URL }); log("share_click", { method: "native" }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mbrmj-challenge.png";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  log("share_click", { method: "download" });
}

/* ---------- events ---------- */
function toggleOpt(el) {
  if (S.phase !== "answer") return;
  const q = QUESTIONS[S.q], id = el.dataset.id;
  if (q.type === "single") S.sel = [id];
  else { const i = S.sel.indexOf(id); if (i >= 0) S.sel.splice(i, 1); else S.sel.push(id); }
  document.querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-checked", S.sel.indexOf(o.dataset.id) >= 0));
  const b = $("#submit"); if (b) b.disabled = !S.sel.length;
  save();
}
function submitAnswer() {
  if (!S.sel.length) return;
  S.tmpTime = Date.now() - (S.qStart || Date.now());
  S.phase = "conf"; save(); scrollTarget = "#conf"; render(false);
}
function pickConf(v) {
  const q = QUESTIONS[S.q], sel = S.sel.slice().sort();
  const missed = q.correct.filter((x) => sel.indexOf(x) < 0), extra = sel.filter((x) => q.correct.indexOf(x) < 0);
  const correct = !missed.length && !extra.length;
  S.answers[S.q] = { sel, conf: v, correct, time: S.tmpTime };
  S.phase = "reveal"; moreOpen = false;
  log("answer", { q: q.id, stage: q.stage, type: q.type, selected_ids: sel, missed_ids: missed, extra_ids: extra, correct, confidence: v, time_ms: S.tmpTime });
  save(); flush(false); scrollTarget = "#rev"; render(false);
}

function submitLead(e) {
  e.preventDefault();
  const name = $("#f-name").value.trim(), cc = $("#f-cc").value, raw = $("#f-phone").value.replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "").replace(/^0+/, "");
  const mail = $("#f-mail").value.trim(), consent = $("#f-consent").checked, err = $("#f-err");
  if (!name) { err.textContent = "اكتب اسمك"; $("#f-name").focus(); return; }
  if (raw.length < 6 || raw.length > 12) { err.textContent = "رقم الجوال غير صحيح"; $("#f-phone").focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { err.textContent = "اكتب إيميل صحيح — راح نرسل لك التقرير عليه"; $("#f-mail").focus(); return; }
  if (!consent) { err.textContent = "لازم توافق على التواصل عشان نرسل لك التقرير"; return; }
  const r = ranked();
  S.lead = { name, whatsapp: cc + raw, email: mail };
  const payload = {
    type: "lead", ts: new Date().toISOString(), session_id: S.sid, visitor_id: S.vid, variant: S.variant, name, whatsapp: cc + raw, email: mail, consent: true,
    score: computeScore(), blind_spots: r.filter((x) => x.st === "blind").map((x) => x.ar).join("، "), gaps: r.filter((x) => x.st === "gap").map((x) => x.ar).join("، "),
    ref: params.get("ref") || "", report: reportData()
  };
  log("contact_submit", {}, "contact");
  S.screen = "report"; save();
  sendLead(payload); flush(false);
  render(true);
}

function freshStart(newSession) {
  const keepVariant = S.variant;
  S = newState(); S.variant = keepVariant;
  if (!newSession) { /* same visitor, new run */ }
  resumeMode = false; moreOpen = false; sheetOpen = false;
  save(); render(true);
}

document.addEventListener("click", (ev) => {
  const t = ev.target;
  if (tipEl && !t.closest(".term")) closeTip();
  const link = t.closest("[data-log]");
  if (link) { log(link.dataset.log); flush(true); return; }
  const term = t.closest(".term");
  if (term) { ev.stopPropagation(); openTip(term); return; }
  const el = t.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "sheet-close") { if (el.classList.contains("scrim") && t !== el) return; sheetOpen = false; render(false); return; }
  switch (a) {
    case "start": S.startedAt = Date.now(); log("start"); flush(false); go("badge"); break;
    case "badge-go": go("brief"); break;
    case "video": playVideo(); break;
    case "resume": resumeMode = false; S.qStart = Date.now(); log("resume", { resumed_at_step: curStep() }); render(true); break;
    case "restart": log("restart"); S = Object.assign(newState(), { sid: S.sid, variant: S.variant }); resumeMode = false; save(); render(true); break;
    case "brief-go": go("q", 0); break;
    case "sheet-open": sheetOpen = true; log("brief_reopen", { q: S.q + 1 }); render(false); break;
    case "opt": toggleOpt(el); break;
    case "submit": submitAnswer(); break;
    case "conf": pickConf(el.dataset.v); break;
    case "more": moreOpen = true; log("explain_expand", { q: S.q + 1 }); render(false); break;
    case "next": if (S.q < 7) go("q", S.q + 1); else complete(); break;
    case "to-contact": S.screen = "contact"; save(); render(true); break;
    case "share": shareResult(); break;
    case "pdf": log("pdf_save"); flush(false); window.print(); break;
    case "again": if (confirm("تبدأ التحدي من جديد؟ تقريرك الحالي بينمسح من هالجهاز.")) { S = Object.assign(newState(), { variant: S.variant }); save(); render(true); } break;
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { closeTip(); if (sheetOpen) { sheetOpen = false; render(false); } return; }
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const el = ev.target.closest && ev.target.closest(".opt, .term");
  if (!el || ev.target.tagName === "BUTTON") return;
  ev.preventDefault();
  if (el.classList.contains("term")) openTip(el); else toggleOpt(el);
});
document.addEventListener("input", (ev) => {
  if (ev.target.id !== "b-name") return;
  S.name = ev.target.value.trim(); save();
  const nm = $("#b-nm"), av = $("#b-av"); if (nm) nm.textContent = S.name || "موظف جديد"; if (av) av.textContent = S.name ? [...S.name][0] : "؟";
});
document.addEventListener("submit", (ev) => { if (ev.target.id === "lead") submitLead(ev); });

function embedUrl(u) {
  let m = u.match(/instagram\.com\/(reel|p|tv)\/([\w-]+)/i);
  if (m) return "https://www.instagram.com/" + m[1] + "/" + m[2] + "/embed";
  m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/i);
  if (m) return "https://www.youtube.com/embed/" + m[1] + "?autoplay=1";
  return u;
}
function playVideo() {
  const u = CONFIG.INTRO_VIDEO_URL, box = $("#vid"); if (!box) return;
  log("intro_video_play");
  if (/\.mp4(\?|$)/i.test(u)) box.innerHTML = '<video src="' + esc(u) + '" controls autoplay playsinline></video>';
  else {
    box.classList.add("tall");
    box.innerHTML = '<iframe src="' + esc(embedUrl(u)) + '" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="فيديو تعريفي"></iframe>';
  }
}

/* ---------- boot ---------- */
(function boot() {
  const saved = loadSaved();
  if (saved) {
    S = saved; S.variant = params.get("v") && TITLES[variant] ? variant : (TITLES[S.variant] ? S.variant : variant);
    if (!S.done && S.screen !== "landing") resumeMode = true;
    if (S.done && S.screen === "landing") S.screen = "result";
  } else S = newState();
  document.title = TITLES[S.variant] + " · مبرمج";
  const pending = store.get(LEAD_KEY);
  if (pending && CONFIG.APPS_SCRIPT_URL) { try { sendLead(JSON.parse(pending)); } catch (e) { store.del(LEAD_KEY); } }
  const ua = navigator.userAgent || "";
  log("page_view", {
    utm_source: params.get("utm_source") || "", utm_medium: params.get("utm_medium") || "", utm_campaign: params.get("utm_campaign") || "",
    ref: params.get("ref") || "", referrer: document.referrer || "", user_agent: ua.slice(0, 200), screen_width: screen.width, language: navigator.language || "",
    device: (innerWidth < 768 ? "mobile" : "desktop") + " " + innerWidth + "px", returning
  });
  save(); flush(false);
  render(true);
})();
</script>
